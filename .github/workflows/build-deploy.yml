## Continuous Integration Workflow
name: Build and Deploy
on: [push]

# Target Branch Job
jobs:
  Lint-Test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
          env:
            POSTGRES_DB: skylab
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
        --health-cmd pg_isready 
        --health-interval 10s 
        --health-timeout 5s 
        --health-retries 5

    steps:
      # Check Out Repository
      - uses: actions/checkout@v1

      # Install Node.js
      - uses: actions/setup-node@v1.4.4
        with:
          node-version: 16.13.2

      # Install Node Dependencies
      - name: Installing NodeJS Dependencies
        run: npm install

      # Run ESLint
      - name: ESLint Check
        run: npx eslint . --config .eslintrc.js --ext .js,.ts

      # Run Prettier
      - name: Prettier Check
        run: npx prettier --check "src/**/*.ts"

      # Create .env file
      - name: Create .env file
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/skylab" > .env
          echo "JWT_SECRET=secret" >> .env
          echo "ADMIN_PASSWORD=Password123" >> .env
          echo "SALT_ROUNDS=5" >> .env

      # Set up database with seed data
      - name: Set up database
        run: npx prisma migrate dev --name init

      # Run test cases with Jest
      - name: Jest tests
        run: npm run test
        
